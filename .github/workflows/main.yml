name: main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  packages: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: prepare
      run: "sudo apt update && sudo apt install -y libsnappy-dev liblzo2-dev"
    - uses: wtnb75/actions/python@v1
      with:
        extra-args: "--extra ext --extra test"
    - uses: wtnb75/actions/ruff@v1
    - uses: wtnb75/actions/pytest@v1
    - uses: wtnb75/actions/wheel@v1
    - id: pdoc
      uses: wtnb75/actions/pdoc@v1
      with:
        output-dir: docs
        module: log2s3
    - uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0
    - name: cache pip
      shell: bash
      run: |
        pip download -d _cache --cache-dir _cache ".[ext]"
        sudo chown -R root. _cache
        for pf in linux/{amd64,arm64}; do
          docker run --platform $pf --rm -v $PWD:/w -w /w python:3-alpine sh -c "apk add --no-cache lzo-dev snappy-dev gcc g++ ; pip wheel -w _cache --cache-dir _cache --find-links _cache '.[ext]'"
        done
        sudo chown -R $(id -u):$(id -g) _cache
    - name: show cache
      run: pip cache list --cache-dir _cache
      shell: bash
    - uses: wtnb75/actions/merge-pages@v1
      with:
        dirs: "cover docs"
        #pydist: dist
    - name: Setup Pages
      uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
    - name: deploy pages
      uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      id: deployment
    - uses: wtnb75/actions/docker@v1
      with:
        push: 'true'
        context: .
        username: ${{ github.actor }}
        password: ${{ github.token }}
        image-version: ${{ github.ref_name }}
